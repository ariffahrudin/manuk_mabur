<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manuk Mabur</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2c3e50;
        }
        
        canvas {
            display: block;
            cursor: pointer;
            touch-action: none;
        }

        #fullscreenButton {
            position: fixed;
            right: 12px;
            bottom: 12px;
            width: 32px;
            height: 32px;
            padding: 0;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.45);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            z-index: 1000;
            -webkit-tap-highlight-color: transparent;
        }

        #fullscreenButton:active {
            background: rgba(255, 255, 255, 0.25);
        }

        #fullscreenButton:focus-visible {
            outline: 2px solid #fff;
            outline-offset: 2px;
        }
        
        /* Desktop styles */
        @media (min-width: 768px) {
            canvas {
                border: 3px solid #000;
                box-shadow: 0 0 20px rgba(0,0,0,0.5);
            }
        }
        
        /* Mobile styles */
        @media (max-width: 767px) {
            canvas {
                width: 100vw;
                //height: 100vh;
                height: 100dvh;
                border: none;
                box-shadow: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <button
        id="fullscreenButton"
        type="button"
        aria-label="Layar penuh"
        title="Layar penuh"
    >⛶</button>

    <script src="game.js?v=3"></script>
</body>
</html>
